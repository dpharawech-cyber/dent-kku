html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}

  }
}
:root[data-theme="dark"]{

  --bg:#101719; --surface:#172124; --sunk:#1E2A2E; --line:#2C3A3F;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:0 110px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.3;text-wrap:balance;margin:0}
h2{font-size:1.5rem} h3{font-size:1.08rem}
p{margin:0}
a{color:var(--slate)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .small{font-size:.86rem}
:focus-visible{outline:2px solid var(--slate);outline-offset:2px;border-radius:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:12px;align-content:start}

.top{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:end;padding-block:34px 22px}
.top h1{font-size:clamp(2rem,5vw,2.9rem)}
.top h1 em{font-style:normal;color:var(--brick)}
.lede{margin-top:8px;color:var(--ink-2);max-width:58ch}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cnt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.cnt .big{font-family:var(--f-display);font-size:2.3rem;line-height:1.05;color:var(--brick)}
.cnt .big small{font-size:.95rem;color:var(--ink-2);margin-left:4px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px}
.tabs .row{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:1080px;margin:0 auto}
.tabs button{appearance:none;border:0;background:none;color:var(--ink-2);font:500 .95rem var(--f-body);padding:12px;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brick)}
section.panel{padding-top:26px;display:grid;gap:20px}
.head{display:grid;gap:6px} .head p{color:var(--ink-2);max-width:70ch}

/* overview */
.hero{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
.ready{display:grid;gap:10px}
.ready .pct{font-family:var(--f-display);font-size:3.2rem;line-height:1;color:var(--ink)}
.ready .pct small{font-size:1rem;color:var(--ink-2);margin-left:6px}
svg.teeth{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.tooth{transition:fill .35s ease}
@media (prefers-reduced-motion:reduce){.tooth{transition:none}}
.sbars{display:grid;gap:10px}
.sb{display:grid;grid-template-columns:7.6em 1fr 3.2em;gap:12px;align-items:center;font-size:.92rem;cursor:pointer;background:none;border:0;padding:0;color:inherit;font-family:inherit;text-align:left}
.sb .nm{display:grid;line-height:1.25}
.sb .nm small{color:var(--ink-3);font-family:var(--f-mono);font-size:.74rem}
.track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .s3{background:var(--ok)} .track .s2{background:var(--warn)} .track .s1{background:var(--bad)}
.sb .v{font-family:var(--f-mono);text-align:right;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--ink-3)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.focus{background:var(--brick-soft);border-radius:8px;padding:12px 14px;font-size:.93rem}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat .big{font-family:var(--f-display);font-size:2rem;line-height:1.1}
.stat .big small{font-size:.9rem;color:var(--ink-2);margin-left:4px}
.gap-ok{color:var(--ok)} .gap-bad{color:var(--bad)}

.subjtabs{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:500 .88rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .num{font-size:.78rem;opacity:.8}
.topics{display:grid;gap:0}
.tp{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tp:first-child{border-top:0}
.steps{display:flex;gap:4px}
.st{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-3);font:500 .78rem var(--f-body);padding:4px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.st.on[data-v="1"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.st.on[data-v="2"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.st.on[data-v="3"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tp .when{display:block;font-size:.76rem;color:var(--ink-3)}
.tp .when.stale{color:var(--warn)}
.st{font-size:.84rem;padding:5px 12px}
.todo{display:grid;gap:0;margin:6px 0 0;padding:0;list-style:none}
.todo li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--brick) 20%,transparent);cursor:pointer}
.todo li:first-child{border-top:0}
.todo .sj{font-size:.76rem;font-family:var(--f-mono);color:var(--ink-3)}
.lvl{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.lvl.l0{background:var(--sunk);color:var(--ink-2)} .lvl.l1{background:var(--bad-soft);color:var(--bad)} .lvl.l2{background:var(--warn-soft);color:var(--warn)}
.sumline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline}

/* mocks */
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:4px} .fld label{font-size:.84rem;color:var(--ink-2)}
.fields>*,.fld{min-width:0}
input,select{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:2.6em;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=date]::-webkit-datetime-edit{padding:0}
input[type=number],input[type=text],input[type=date],select{width:100%;font:500 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:500 .92rem var(--f-body);padding:8px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.brick{background:var(--brick);border-color:var(--brick);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-3);font-size:.8rem}
td.n{font-family:var(--f-mono);text-align:right}
.tblwrap{overflow-x:auto;max-height:340px;overflow-y:auto}
.x{appearance:none;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:1.05rem}
svg.chart{width:100%;height:auto;display:block}
.latest{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lt{background:var(--sunk);border-radius:8px;padding:8px 10px;display:grid}
.lt b{font-family:var(--f-mono);font-size:1.15rem}
.lt span{font-size:.78rem;color:var(--ink-3)}
.lt.low b{color:var(--bad)}

/* heatmap */
.hmwrap{overflow-x:auto;padding-bottom:4px}
svg.hm{display:block;min-width:620px;width:100%;height:auto}
.hm rect.day{cursor:pointer;stroke:var(--bg);stroke-width:2}
.hm rect.day.future{cursor:default;opacity:.35}
.hm rect.today{stroke:var(--ink);stroke-width:1.5}
.hmleg{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--ink-3);flex-wrap:wrap}
.hmleg i{width:14px;height:14px;border-radius:3px;display:inline-block}

/* timeline + tasks */
.tl{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ev{display:grid;grid-template-columns:auto 7.4em 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev input{width:18px;height:18px;accent-color:var(--brick)}
.ev .d{font-family:var(--f-mono);font-size:.84rem;color:var(--ink-2)}
.ev .src{font-size:.78rem;color:var(--ink-3)}
.ev.done .t b{text-decoration:line-through;color:var(--ink-3)}
.ev.past:not(.done){background:var(--warn-soft)}
.ev.nextup{background:var(--brick-soft)}
.ev .cd{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2);text-align:right;white-space:nowrap}
.weights{display:grid;gap:6px}
.w{display:grid;grid-template-columns:10em 1fr 3em;gap:10px;align-items:center;font-size:.9rem}
.w .bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.w .bar i{display:block;height:100%;background:var(--slate)}
.w .v{font-family:var(--f-mono);text-align:right;color:var(--ink-2)}
.note{font-size:.9rem;color:var(--ink);background:var(--sunk);border-radius:8px;padding:10px 12px}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
ul.tight{margin:0;padding-left:1.1em;display:grid;gap:4px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.links a{display:grid;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.links a span{font-size:.82rem;color:var(--ink-3)}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:1080px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px}
.dot.pend{background:var(--warn)} .dot.ro{background:var(--ink-3)}
body.viewing .st,body.viewing rect.day,body.viewing .ev,body.viewing .x{cursor:default}

@media (max-width:780px){
  .top,.hero,.two{grid-template-columns:1fr}
  .tri{grid-template-columns:1fr}
  .latest{grid-template-columns:repeat(2,1fr)}
  .ev{grid-template-columns:auto 1fr;}
  .ev .d{grid-column:2} .ev .t{grid-column:2} .ev .cd{grid-column:2;text-align:left}
  .ev input{grid-row:1/4;align-self:start;margin-top:4px}
  .tp{grid-template-columns:1fr}
  .w{grid-template-columns:8em 1fr 3em}
}
</style>

 let wk=0;for(let i=0;i<7;i++){const x=new Date(TODAY);x.setDate(x.getDate()-i);wk+=LVH[S.days[iso(x)]||0]}return{n:ks.length,hrs,streak,wk}}

function buildTeeth(){
  const widths=[18,20,22,20,22,26,30,30];const order=[];
  [['up',1],['up',2],['lo',3],['lo',4]].forEach(([arch,q])=>{for(let i=0;i<8;i++){const side=(q===1||q===4)?-1:1;const ang=(0.1+i/7*0.8)*Math.PI/2*side;const cx=220+Math.sin(ang)*180;const cy=arch==='up'?120-Math.cos(ang)*92:130+Math.cos(ang)*96;order.push({id:q*10+i+1,cx,cy,w:widths[i]-2,h:i>4?26:30,up:arch==='up',molar:i>=5})}});
  [...order].sort((a,b)=>(a.id%10)-(b.id%10)||a.id-b.id).forEach((o,k)=>o.k=k);
  const P=(o)=>{const{cx,cy,w,h,up,molar}=o,r=w/2;if(up)return molar?`M${cx-r},${cy-h/2} Q${cx},${cy-h/2-4} ${cx+r},${cy-h/2} L${cx+r-1},${cy+h/2-4} Q${cx+r/2},${cy+h/2+2} ${cx},${cy+h/2-2} Q${cx-r/2},${cy+h/2+2} ${cx-r+1},${cy+h/2-4} Z`:`M${cx-r+1},${cy-h/2} Q${cx},${cy-h/2-5} ${cx+r-1},${cy-h/2} L${cx+r},${cy+h/2-5} Q${cx},${cy+h/2+4} ${cx-r},${cy+h/2-5} Z`;return molar?`M${cx-r+1},${cy-h/2+4} Q${cx-r/2},${cy-h/2-2} ${cx},${cy-h/2+2} Q${cx+r/2},${cy-h/2-2} ${cx+r-1},${cy-h/2+4} L${cx+r},${cy+h/2} Q${cx},${cy+h/2+4} ${cx-r},${cy+h/2} Z`:`M${cx-r},${cy-h/2+5} Q${cx},${cy-h/2-4} ${cx+r},${cy-h/2+5} L${cx+r-1},${cy+h/2} Q${cx},${cy+h/2+5} ${cx-r+1},${cy+h/2} Z`};
  $('#teeth').innerHTML=order.map(o=>{const dx=o.cx-220,dy=o.cy-125,dl=Math.hypot(dx,dy)||1;return `<path class="tooth" data-k="${o.k}" d="${P(o)}" stroke="var(--tooth-line)" stroke-width="1.2" fill="var(--tooth)"/><text x="${(o.cx+dx/dl*24).toFixed(1)}" y="${(o.cy+dy/dl*24+3).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="var(--ink-3)">${o.id}</text>`}).join('')+`<text x="220" y="130" text-anchor="middle" font-family="Mitr,sans-serif" font-size="14" fill="var(--ink-2)" id="teethMid"></text>`;
}

function drawHM(svg,interactive){
  const start=pd(HM_START),end=pd(HM_END);const s0=new Date(start);s0.setDate(s0.getDate()-((s0.getDay()+6)%7));
  const cs=interactive?22:16,L=interactive?30:26,T=18;let g='';const weeks=Math.ceil((end-s0)/864e5/7)+1;
  ['จ','','พ','','ศ','','อา'].forEach((d,i)=>{if(d)g+=`<text x="${L-6}" y="${T+i*cs+cs*.72}" text-anchor="end" font-size="${interactive?10:9}" fill="var(--ink-3)" font-family="IBM Plex Sans Thai,sans-serif">${d}</text>`});
  let lastM=-1;
  for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){
    const dt=new Date(s0);dt.setDate(s0.getDate()+w*7+d);if(dt<start||dt>end)continue;
    const k=iso(dt),lv=S.days[k]||0,fut=k>TISO,x=L+w*cs,y=T+d*cs;
    if(d===0&&dt.getDate()<=7&&dt.getMonth()!==lastM){lastM=dt.getMonth();g+=`<text x="${x}" y="${T-6}" font-size="${interactive?10:9}" fill="var(--ink-3)" font-family="IBM Plex Sans Thai,sans-serif">${TH[dt.getMonth()]}</text>`}
    const special=(k==='2027-02-13'||k==='2027-03-13'||k==='2027-03-14'||k==='2027-03-15');
    g+=`<rect class="day ${fut?'future':''} ${k===TISO?'today':''}" ${interactive&&!fut?`data-day="${k}" tabindex="0" role="button"`:''} x="${x}" y="${y}" width="${cs-2}" height="${cs-2}" rx="3" fill="${special?'var(--ink)':`var(--h${lv})`}"><title>${fmt(k)} · ${special?(k==='2027-02-13'?'สอบ TPAT1':'สอบ A-Level'):LV[lv]}</title></rect>`;
  }
  const W=L+weeks*cs+4,H=T+7*cs+4;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.width=W+'px';svg.style.maxWidth=interactive?'none':'100%';svg.style.minWidth=interactive?W+'px':'0';svg.innerHTML=g;
}

const b64u=u8=>{let s='';u8.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');const s=atob(t);return Uint8Array.from(s,c=>c.charCodeAt(0))};
async function pack(o){const raw=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}catch(e){}}
  return 'j'+b64u(raw)}
async function unpack(t){const kind=t[0],u8=ub64(t.slice(1));let bytes=u8;
  if(kind==='z'){const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(bytes))}
async function doShare(){
  const url=location.origin+location.pathname+'#p='+(await pack(S));const m=$('#saveTxt');
  try{if(navigator.share){await navigator.share({title:'ความคืบหน้าทันตะ มข.',url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);m.innerHTML='<span class="dot"></span>คัดลอกลิงก์แล้ว ส่งทาง LINE ได้เลย'}
  catch(e){prompt('คัดลอกลิงก์นี้',url)}
}
